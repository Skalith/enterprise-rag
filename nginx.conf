# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — reverse proxy for Enterprise RAG
#
# Purpose
#   Single entry point on port 80 (docker-compose service "nginx"):
#     /api/*  -> backend  (FastAPI,  http://backend:8011)
#     /*      -> frontend (http://frontend:3000)
#
# Key settings
#   server_tokens off         Hide the nginx version in headers / error pages.
#   proxy_read/send_timeout   300s so slow LLM responses and big uploads are not cut off.
#   client_max_body_size 55M  Slightly above MAX_UPLOAD_MB (50) so the API, not nginx,
#                             returns the friendly "file too large" error. Keep the two in sync.
#   Upgrade / Connection      Lets Next.js dev-mode hot reload (WebSocket) work through the proxy.
#
# Notes
#   - Service names (backend, frontend) are Docker Compose DNS names; they only
#     resolve inside the compose network.
#   - If you add streaming (SSE) for chat, add `proxy_buffering off;` to the /api/ block,
#     otherwise nginx buffers the stream and the client sees it all at once.
#   - TLS is not configured here. Terminate HTTPS at a load balancer or add a
#     `listen 443 ssl;` server block with your certificates before going to production.
# ─────────────────────────────────────────────────────────────────────────────
events {
  worker_connections 1024;
}

http {
  # Don't expose nginx version in error pages
  server_tokens off;

  # Increase timeouts for large file uploads and LLM responses
  proxy_read_timeout 300s;
  proxy_connect_timeout 10s;
  proxy_send_timeout 300s;

  server {
    listen 80;

    # Backend API — all /api/ requests go to FastAPI
    location /api/ {
      proxy_pass http://backend:8011;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Allow large file uploads (matches MAX_UPLOAD_MB=50)
      client_max_body_size 55M;
    }

    # Frontend — everything else goes to Next.js frontend
    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket support for Next.js HMR in dev
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
